name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v4.0.1)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Unit tests (a failing test stops the release)
        run: gradle testDebugUnitTest --no-daemon
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and AAB
        env:
          DASHLENS_KEYSTORE: ${{ runner.temp }}/release.jks
          DASHLENS_KS_PASS: ${{ secrets.KS_PASS }}
          DASHLENS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DASHLENS_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dashlens-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir out
          cp "$APK" "out/DashLens-$TAG.apk"
          cp "$APK" out/DashLens.apk
          (cd out && sha256sum "DashLens-$TAG.apk" DashLens.apk > SHA256SUMS.txt)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "DashLens $TAG" --generate-notes
          gh release upload "$TAG" out/* --clobber
