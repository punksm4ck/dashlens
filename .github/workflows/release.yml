name: release
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK and AAB
        env:
          DASHLENS_KEYSTORE: ${{ runner.temp }}/release.jks
          DASHLENS_KS_PASS: ${{ secrets.KS_PASS }}
          DASHLENS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DASHLENS_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dashlens-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
